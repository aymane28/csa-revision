name: Push reminders

on:
  schedule:
    - cron: "0 7 * * *" # ~9h Paris (été) / ~8h (hiver) — rappel du matin
    - cron: "0 18 * * *" # ~20h Paris (été) / ~19h (hiver) — rappel du soir
  workflow_dispatch:
    inputs:
      slot:
        description: "morning ou evening"
        required: false
        default: "morning"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event.schedule }}" = "0 18 * * *" ]; then
            echo "slot=evening" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.slot }}" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            echo "slot=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Send reminder
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/push/send?slot=${{ steps.slot.outputs.slot }}" \
            -H "x-reminder-secret: ${{ secrets.REMINDER_SECRET }}"
