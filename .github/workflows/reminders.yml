name: Push reminders

on:
  schedule:
    # Minutes décalées (pas ":00") car GitHub retarde/saute parfois les cron pile à l'heure
    # ronde à cause de la charge — cf. https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: "7 7 * * *" # ~9h07 Paris (été) / ~8h07 (hiver) — rappel du matin
    - cron: "7 18 * * *" # ~20h07 Paris (été) / ~19h07 (hiver) — rappel du soir
  workflow_dispatch:
    inputs:
      slot:
        description: "morning ou evening"
        required: false
        default: "morning"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event.schedule }}" = "7 18 * * *" ]; then
            echo "slot=evening" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.slot }}" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            echo "slot=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Send reminder
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/push/send?slot=${{ steps.slot.outputs.slot }}" \
            -H "x-reminder-secret: ${{ secrets.REMINDER_SECRET }}"
